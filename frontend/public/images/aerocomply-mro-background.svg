<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="presentation" aria-hidden="true">
  <defs>
    <linearGradient id="acBaseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f1728" />
      <stop offset="55%" stop-color="#0a0f1a" />
      <stop offset="100%" stop-color="#060a12" />
    </linearGradient>
    <radialGradient id="acCoolGlow" cx="30%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#3d8bff" stop-opacity="0.14" />
      <stop offset="45%" stop-color="#3d8bff" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#3d8bff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="acWorkLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb066" stop-opacity="0.55" />
      <stop offset="35%" stop-color="#ff9a4d" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#ff9a4d" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="acFuselageGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#44557a" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#44557a" stop-opacity="0.32" />
    </linearGradient>
    <radialGradient id="acVignette" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0" />
      <stop offset="70%" stop-color="#000000" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.6" />
    </radialGradient>
    <filter id="acSoften" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" />
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#acBaseGrad)" />
  <rect width="1920" height="1080" fill="url(#acCoolGlow)" />

  <!-- Faint blueprint grid -->
  <g stroke="#7f95c0" stroke-opacity="0.045" stroke-width="1">
    <path d="M160,0 V1080" /><path d="M320,0 V1080" /><path d="M480,0 V1080" /><path d="M640,0 V1080" />
    <path d="M800,0 V1080" /><path d="M960,0 V1080" /><path d="M1120,0 V1080" /><path d="M1280,0 V1080" />
    <path d="M1440,0 V1080" /><path d="M1600,0 V1080" /><path d="M1760,0 V1080" />
    <path d="M0,120 H1920" /><path d="M0,240 H1920" /><path d="M0,360 H1920" /><path d="M0,480 H1920" />
    <path d="M0,600 H1920" /><path d="M0,720 H1920" /><path d="M0,840 H1920" /><path d="M0,960 H1920" />
  </g>

  <!-- Hangar roof trusses -->
  <g stroke="#8fa3c9" stroke-opacity="0.09" stroke-width="2" fill="none">
    <path d="M-100,50 L420,230 L940,50" />
    <path d="M320,50 L840,240 L1360,50" />
    <path d="M760,50 L1280,250 L1800,50" />
    <path d="M0,0 L1920,0" stroke-opacity="0.12" />
  </g>

  <!-- Hangar floor perspective lines -->
  <g stroke="#8fa3c9" stroke-opacity="0.06" stroke-width="1.5" fill="none">
    <path d="M0,1080 L740,800" />
    <path d="M520,1080 L900,800" />
    <path d="M1000,1080 L1060,800" />
    <path d="M1480,1080 L1220,800" />
    <path d="M1920,1080 L1360,800" />
  </g>

  <!-- Warm work-light pool near the engine/technician area -->
  <ellipse cx="1180" cy="640" rx="420" ry="360" fill="url(#acWorkLight)" />

  <!-- Aircraft: forward fuselage + open engine cowling, entering from the right -->
  <g transform="translate(1040,470)" filter="url(#acSoften)">
    <path d="M -80,-50 C 260,-105 640,-85 940,-15 C 962,-6 962,8 940,17 C 640,88 260,110 -80,58 C -114,22 -114,-14 -80,-50 Z"
          fill="url(#acFuselageGrad)" stroke="#98a9cc" stroke-opacity="0.22" stroke-width="1.5" />
    <path d="M -80,-50 C -114,-14 -114,22 -80,58" fill="none" stroke="#c3cfe8" stroke-opacity="0.18" stroke-width="1.5" />
    <path d="M -40,-34 C 40,-52 130,-58 220,-55" fill="none" stroke="#c3cfe8" stroke-opacity="0.22" stroke-width="3" />
    <path d="M -70,4 C 260,-16 640,-6 935,4" fill="none" stroke="#c3cfe8" stroke-opacity="0.15" stroke-width="1" />

    <path d="M 360,26 L 270,300 L 420,300 L 445,36 Z" fill="#2c3a56" fill-opacity="0.4" stroke="#98a9cc" stroke-opacity="0.16" stroke-width="1.5" />
    <path d="M 345,66 L 310,220" stroke="#98a9cc" stroke-opacity="0.22" stroke-width="5" />
  </g>

  <!-- Open engine nacelle / cowling, lit by the work light -->
  <g transform="translate(1350,650)">
    <ellipse cx="0" cy="0" rx="150" ry="170" fill="#141d33" fill-opacity="0.55" stroke="#a9bbe0" stroke-opacity="0.3" stroke-width="2.5" />
    <ellipse cx="0" cy="0" rx="150" ry="170" fill="none" stroke="#ffb066" stroke-opacity="0.12" stroke-width="10" />
    <ellipse cx="10" cy="-6" rx="96" ry="118" fill="#0a0f1a" fill-opacity="0.75" stroke="#7f95c0" stroke-opacity="0.3" stroke-width="1.5" />
    <g stroke="#c3cfe8" stroke-opacity="0.28" stroke-width="2.5">
      <path d="M 10,-96 L 10,88" />
      <path d="M -58,-56 L 78,32" />
      <path d="M -58,32 L 78,-56" />
      <path d="M -40,-84 L 62,68" />
      <path d="M -40,68 L 62,-84" />
    </g>
    <circle cx="10" cy="-6" r="18" fill="#0d1424" stroke="#98a9cc" stroke-opacity="0.4" stroke-width="1.5" />
  </g>

  <!-- Technician silhouette, standing beside the engine, lit from the work-light -->
  <g transform="translate(1210,760)">
    <ellipse cx="0" cy="330" rx="46" ry="10" fill="#000000" fill-opacity="0.35" />
    <path d="M -8,-58 C -8,-84 26,-84 26,-58 L 30,-6 C 46,4 60,30 62,64 L 46,70 C 40,44 30,26 18,14
             L 22,140 L 34,300 L 12,300 L 2,150 L -10,150 L -18,300 L -40,300 L -30,138 L -34,10
             C -46,22 -54,42 -58,68 L -74,60 C -70,28 -56,2 -40,-8 L -36,-58 Z"
          fill="#050810" fill-opacity="0.82" />
    <circle cx="9" cy="-84" r="19" fill="#050810" fill-opacity="0.82" />
    <path d="M -8,-58 C -8,-84 26,-84 26,-58" fill="none" stroke="#ffb066" stroke-opacity="0.25" stroke-width="2" />
  </g>

  <!-- Maintenance gantry, far right -->
  <g stroke="#8fa3c9" stroke-opacity="0.1" stroke-width="2" fill="none">
    <path d="M1800,1080 L1800,660 L1900,660 L1900,1080" />
    <path d="M1800,780 L1900,780" />
    <path d="M1800,900 L1900,900" />
  </g>

  <rect width="1920" height="1080" fill="url(#acVignette)" />
</svg>
