name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aerocomply
          POSTGRES_PASSWORD: aerocomply
          POSTGRES_DB: aerocomply_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aerocomply"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy app

      - name: Run migrations against test database
        env:
          DATABASE_URL: postgresql+psycopg://aerocomply:aerocomply@localhost:5432/aerocomply_test
        run: alembic upgrade head

      - name: Run tests
        env:
          TEST_DATABASE_URL: postgresql+psycopg://aerocomply:aerocomply@localhost:5432/aerocomply_test
        run: pytest -v

      # M17.2: dependency vulnerability visibility. Non-blocking
      # (continue-on-error) because it calls an external advisory database
      # (PyPI's OSV-backed index) that this repo's CI has no existing
      # convention of depending on for pass/fail -- a transient network
      # failure here must never fail the build. Findings are still visible
      # in the job log/summary for a human to act on.
      - name: Dependency vulnerability scan (pip-audit)
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit --strict || true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          # No `cache: npm` here: caching requires a committed package-lock.json,
          # which does not yet exist (no Node runtime was available to generate
          # one during M0 authoring). Re-enable caching once a lockfile is committed.

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      # M17.2: same non-blocking visibility as the backend's pip-audit step
      # above -- npm's own advisory database, informational only.
      - name: Dependency vulnerability scan (npm audit)
        continue-on-error: true
        run: npm audit --audit-level=high
